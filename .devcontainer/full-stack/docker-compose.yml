services:
  backend:
    image: mcr.microsoft.com/devcontainers/universal:2
    volumes:
      - /workspaces:/workspaces
    environment:
      - PGHOST=postgres
      - PGUSER=payt
      - PGPASSWORD=payt_password
      - PGDATABASE=debiteurenbeheer_development
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_IMPORT_STATS_URL=redis://redis:6379/0
      - REDIS_SESSIONS_URL=redis://redis:6379/2
      - REDIS_WORKER_URL=redis://redis:6379/3
      - ELASTICSEARCH_FRONTEND_URL=http://elasticsearch:9200
      - SMTP_HOST=localhost
      - BUNDLE_ENTERPRISE__CONTRIBSYS__COM
      - NODE_AUTH_TOKEN
      - RAILS_MASTER_KEY
      - SECRET_KEY_BASE=b557ee68c33d6aa224cca3727c7ce0dcfcbde66876beeefd7c8543522925d554873a7cfe2947a0e552b56db80e530654d71c1f3fc12cce3c574c57e00dd627fb
      - LOCKBOX_MASTER_KEY=3f642415a98565a61c33e0ec33677767a48dba53cf1031761e093f2510c5bc53
      - CODESPACE_NAME
      - CORS_ORIGINS=https://${CODESPACE_NAME}-5000.app.github.dev,https://${CODESPACE_NAME}-5001.app.github.dev
    depends_on:
      - postgres
      - redis
      - elasticsearch
    command: sleep infinity

  postgres:
    image: payt/postgres:18.1
    environment:
      POSTGRES_USER: payt
      POSTGRES_PASSWORD: payt_password
      POSTGRES_DB: debiteurenbeheer_development
    volumes:
      - postgres_data:/var/lib/postgresql

  elasticsearch:
    image: elasticsearch:8.19.3
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: single-node
      cluster.name: docker-cluster
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.graph.enabled: "false"
      xpack.watcher.enabled: "false"
    ulimits:
      nproc: 4096
      nofile: 262144
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.0-alpine
    volumes:
      - redis_data:/data

networks:
  default:
    name: payt

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
